[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackathon-deepseek-agent"
version = "0.1.0"
description = "A local LangGraph learning server with DeepSeek tool calling"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "langgraph==1.2.11",
    "langchain-deepseek>=0.1,<2",
    "langgraph-cli[inmem]>=0.4,<1",
    "langgraph-checkpoint-postgres>=3,<4",
    "python-dotenv>=1.2,<2",
    "pydantic>=2.10,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary,pool]>=3.2,<4",
]

[tool.setuptools]
py-modules = ["api", "config", "contracts_v0", "fulfillment", "graph", "part_c", "runtime_settings", "state"]

[tool.setuptools.packages.find]
include = [
    "deepseek_agent*",
    "execution*",
    "part1*",
    "part2*",
    "part3*",
    "part45*",
    "property_agent*",
    "providers*",
    "requirement_understanding*",
    "evaluation_suite*",
]
