name: hackathon

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-property_agent}
      POSTGRES_USER: ${POSTGRES_USER:-property_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-property_agent_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - property-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  property-agent-postgres:
